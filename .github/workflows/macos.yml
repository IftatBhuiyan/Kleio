name: macOS and connector
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build without private configuration or signing
        run: xcodebuild -project WhisperSpeech.xcodeproj -scheme WhisperSpeech -configuration Debug -destination 'platform=macOS' -derivedDataPath /tmp/kleio-build/dd CODE_SIGNING_ALLOWED=NO build
  connector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connector
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: connector/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node --check server.mjs
      - run: npm audit --omit=dev
